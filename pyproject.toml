[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-committee"
version = "1.4.1"
description = "Explainable multi-agent equity screening, point-in-time backtesting and tamper-evident paper trading ledger"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Amen Bedoui"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
committee = "committee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E701", "E702", "E731"]
